name: WoodcutterJob
version: '${project.version}'
main: com.regayagamtor.woodcutterjob.WoodcutterJob
api-version: '1.21'
authors: [RegayaGamtor]
description: Woodcutter job with a GUI minigame. Registered trees never break and use a persistent cooldown.
softdepend: [Vault, PlaceholderAPI]

commands:
  woodcutter:
    description: Woodcutter Job command
    usage: /woodcutter <set|remove|info|list|reload|stats|cancel|help>
    aliases: [wcjob]

permissions:
  woodcutter.use:
    description: Allows using registered trees and viewing own stats
    default: true
  woodcutter.set:
    description: Allows registering trees
    default: op
  woodcutter.remove:
    description: Allows removing registered trees
    default: op
  woodcutter.reload:
    description: Allows reloading the plugin
    default: op
  woodcutter.info:
    description: Allows viewing tree info and the tree list
    default: op
  woodcutter.admin:
    description: All admin permissions
    default: op
    children:
      woodcutter.use: true
      woodcutter.set: true
      woodcutter.remove: true
      woodcutter.reload: true
      woodcutter.info: true

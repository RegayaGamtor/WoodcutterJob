name: Build WoodcutterJob

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: WoodcutterJob-jar
          path: target/WoodcutterJob-*.jar
